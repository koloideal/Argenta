[project]
name = "argenta"
version = "1.2.0"
description = "Python library for building modular CLI applications"
authors = [{ name = "kolo", email = "kolo.is.main@gmail.com" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "cli-app", "command-line", "terminal", "modular", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "rich (>=14.0.0,<15.0.0)",
    "art (>=6.4,<7.0)",
    "dishka>=1.7.2",
    "prompt-toolkit>=3.0.52",
]

[project.urls]
Homepage = "https://argenta.readthedocs.io"
Documentation = "https://argenta.readthedocs.io"
Repository = "https://github.com/koloideal/Argenta"
Issues = "https://github.com/koloideal/Argenta/issues"
Changelog = "https://github.com/koloideal/Argenta/blob/master/CHANGELOG.md"

[project.scripts]
argenta = "argenta._cli.__main__:main"

[project.optional-dependencies]
cli = [
    "nuitka[onefile]>=4.0.5",
    "typer>=0.9,!=0.12,<=0.21.1",
]

[dependency-groups]
dev = [
    {include-group = "linters"},
    {include-group = "typecheckers"},
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "metrics"},
    "scriv>=1.8.0",
]
linters = [
    "isort>=7.0.0",
    "ruff>=0.12.12",
    "wemake-python-styleguide>=0.17.0",
]
typecheckers = [
    "mypy>=1.14.1",
]
docs = [
    "esbonio>=1.0.0",
    "shibuya>=2025.9.25",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-intl>=2.3.2",
]
tests = [
    "pyfakefs>=5.5.0",
    "pytest>=8.3.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
]
metrics = [
    "matplotlib>=3.10.8",
    "psutil>=7.2.1",
    "py-cpuinfo>=9.0.0",
    "cairosvg>=2.8.2",
    "pygal>=3.1.0",
]

[tool.ruff]
line-length = 100

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[[tool.pyright.executionEnvironments]]
root = "tests/"
reportPrivateUsage = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "metrics/"
reportPrivateUsage = false
reportUnusedFunction = false

[tool.coverage.run]
branch = true
omit = [
    "src/argenta/app/protocols.py",
    "src/argenta/*/exceptions.py",
    "src/argenta/metrics/*"
]

[tool.scriv]
format = "md"
output_file = "CHANGELOG.md"
fragment_directory = "changelog.d"
categories = [
    "Added",
    "Changed",
    "Deprecated",
    "Removed",
    "Fixed",
]
md_header_level = "2"

[tool.mypy]
disable_error_code = "import-untyped"

[tool.isort]
line_length = 90

[build-system]
requires = ["uv_build>=0.4,<0.12"]
build-backend = "uv_build"