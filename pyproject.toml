[project]
name = "argenta"
version = "1.3.0"
description = "Python library for building modular CLI applications"
authors = [{ name = "kolo", email = "kolo.is.main@gmail.com" }]
requires-python = ">=3.12,<3.16"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "cli-app", "command-line", "terminal", "modular", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "rich>=14.0.0,<16.0.0",
    "art (>=6.4,<7.0)",
    "dishka>=1.7.2",
    "prompt-toolkit>=3.0.52",
]

[project.urls]
Homepage = "https://argenta.wiki"
Documentation = "https://argenta.wiki"
Repository = "https://github.com/koloideal/Argenta"
Issues = "https://github.com/koloideal/Argenta/issues"
Changelog = "https://github.com/koloideal/Argenta/blob/master/CHANGELOG.md"

[project.scripts]
argenta = "argenta._cli.__main__:main"

[project.optional-dependencies]
cli = [
    "nuitka[onefile]>=4.0.5",
    "typer>=0.9,!=0.12,<=0.27.3",
]

[dependency-groups]
dev = [
    {include-group = "linters"},
    {include-group = "typecheckers"},
    {include-group = "docs"},
    {include-group = "tests"},
    {include-group = "metrics"},
    "scriv>=1.8.0",
]
linters = [
    "flake8-pyproject>=1.2.3",
    "ruff>=0.12.12",
    "wemake-python-styleguide>=1.0.0",
]
typecheckers = [
    "mypy>=1.14.1",
]
docs = [
    "shibuya>=2025.9.25",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-sitemap>=2.6",
]
tests = [
    "hypothesis>=6.0",
    "pyfakefs>=5.5.0",
    "pytest>=8.3.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "syrupy>=4",
    "typer>=0.9,!=0.12,<=0.27.3",
]
metrics = [
    "matplotlib>=3.10.8",
    "psutil>=7.2.1",
    "py-cpuinfo>=9.0.0",
    "cairosvg>=2.8.2",
    "pygal>=3.1.0",
]
fuzz = [
    "atheris>=3.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PT",   # flake8-pytest-style
    "PERF", # perflint
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RET",  # flake8-return
]
# Codes ruff does not know but must keep in noqa comments (wemake-python-styleguide)
external = ["WPS"]

[tool.flake8]
max-line-length = 100
per-file-ignores = """
*__init__.py:F401,F403
*tests/*:WPS
*metrics/*:WPS
*examples/*:WPS
*integration.py:WPS410
*app/presentation/renderers.py:WPS602,WPS118,WPS214
*command/flag/defaults.py:WPS115
*behavior_handlers/models.py:WPS615,WPS211
*dividing_line/models.py:WPS615
*argparser/arguments/models.py:WPS110,WPS211
*entrypoint_resolver/exceptions.py:WPS118
*autocompleter/entity.py:WPS421
*app/models.py:WPS201,WPS211,WPS214,WPS421
*_cli/__main__.py:WPS202
"""

[tool.coverage.report]
fail_under = 100

[tool.coverage.run]
branch = true
omit = [
    "src/argenta/app/protocols.py",
    "src/argenta/*/exceptions.py"
]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--strict-markers -ra"
xfail_strict = true
filterwarnings = ["error"]

[tool.scriv]
format = "md"
output_file = "CHANGELOG.md"
fragment_directory = "changelog.d"
categories = [
    "Added",
    "Changed",
    "Deprecated",
    "Removed",
    "Fixed",
]
md_header_level = "2"

[tool.mypy]
disable_error_code = "import-untyped"

[[tool.mypy.overrides]]
module = ["typer", "typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "argenta._cli.*"
disallow_any_unimported = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

[build-system]
requires = ["uv_build>=0.4,<0.13"]
build-backend = "uv_build"
