name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/argenta

    permissions:
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.13"

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # no cache: a poisoned dependency cache must never feed a release build
        enable-cache: false
        version: "0.13.0"

    - name: Install dependencies
      run: uv sync --frozen --no-dev

    - name: Build distribution
      run: uv build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
