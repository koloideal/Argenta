name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        # 3.15 is a pre-release: coverage's prebuilt C tracer fails to
        # import on it, so coverage is built from source (pure-Python)
        include:
          - python-version: "3.15"
            uv-sync-extra-args: "--no-binary-package coverage"

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv sync --group tests ${{ matrix.uv-sync-extra-args }}

    - name: Run tests
      run: uv run python -m pytest --cov=argenta --cov-report=term-missing tests
