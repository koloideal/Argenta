name: fuzz-batch

on:
  schedule:
    # Weekly, Sunday 05:15 UTC.
    - cron: "15 5 * * 0"
  workflow_dispatch:

permissions: {}

jobs:
  batch-fuzzing:
    name: batch-fuzzing (${{ matrix.sanitizer }})

    runs-on: ubuntu-latest

    permissions:
      contents: read

    concurrency:
      group: cflite-batch-${{ matrix.sanitizer }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]

    steps:
    - name: Build fuzzers
      id: build
      uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
      with:
        language: python
        sanitizer: ${{ matrix.sanitizer }}

    - name: Run fuzzers
      id: run
      uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        fuzz-seconds: 1800
        mode: batch
        sanitizer: ${{ matrix.sanitizer }}

    - name: Upload crashes
      if: failure() && steps.run.outcome == 'success'
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: crashes-${{ matrix.sanitizer }}
        path: ./out/artifacts
