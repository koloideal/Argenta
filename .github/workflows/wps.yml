name: wps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  wps:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group linters

    - name: Run style checker
      run: uv run python -m flake8 --format=wemake ./src ./tests ./metrics ./examples
