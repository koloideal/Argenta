name: sec-scorecard

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

permissions: {}

jobs:
  analysis:
    name: scorecard

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write # upload SARIF results to code scanning
      id-token: write # sign and publish results to the OpenSSF API

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true
        # PAT with Administration:read — needed to inspect branch protection rules
        repo_token: ${{ secrets.SCORECARD_TOKEN }}

    - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: results.sarif
