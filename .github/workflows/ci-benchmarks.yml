name: ci-benchmarks

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "metrics/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-benchmarks.yml"

permissions: {}

concurrency:
  group: ci-benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  COMMENT_MARKER: "<!-- argenta-benchmarks -->"

jobs:
  measure:
    name: benchmarks

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: .bench/base-src
        persist-credentials: false

    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        version: "0.13.0"

    - name: Install main and this branch side by side
      run: |
        uv venv .bench/base --python 3.13
        uv venv .bench/head --python 3.13
        uv pip install --python .bench/base/bin/python .bench/base-src
        uv pip install --python .bench/head/bin/python .

    - name: Compare benchmarks
      run: |
        .bench/head/bin/python -m metrics.ci.compare \
          --base-python .bench/base/bin/python \
          --head-python .bench/head/bin/python \
          --output report.md
        { echo "$COMMENT_MARKER"; cat report.md; } > comment.md
        cat report.md >> "$GITHUB_STEP_SUMMARY"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: benchmark-report
        path: comment.md

  comment:
    name: benchmarks-comment

    needs: measure

    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write # create or update the benchmark comment

    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: benchmark-report

    - name: Create or update the PR comment
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$COMMENT_MARKER\")) | .id" | head -n 1)
        if [ -n "$comment_id" ]; then
          gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@comment.md
        else
          gh pr comment "$PR_NUMBER" --body-file comment.md
        fi
