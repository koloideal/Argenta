name: ci-benchmarks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Lets CodSpeed trigger backtests to generate initial baseline data.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: benchmarks

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.13"

    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        version: "0.13.0"

    - name: Install dependencies
      run: uv sync --no-dev --group benchmarks

    - name: Run benchmarks
      uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
      with:
        mode: simulation
        run: uv run --no-sync pytest metrics/test_codspeed.py --codspeed
