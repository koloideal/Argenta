name: dependabot auto-merge

on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  auto-merge:

    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    permissions:
      contents: write # gh pr merge pushes the merge commit
      pull-requests: write # gh pr merge --auto toggles the merge queue flag

    steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # Major version bumps require human review; patch/minor merge
    # automatically once required checks pass.
    - name: Enable auto-merge for non-major updates
      if: steps.metadata.outputs.update-type != 'version-update:semver-major'
      run: gh pr merge --auto --merge "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
