name: docs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --group docs

    - name: Build documentation
      run: uv run python -m sphinx -b html -W docs docs/_build
