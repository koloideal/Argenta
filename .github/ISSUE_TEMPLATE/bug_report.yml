name: Bug report
description: Report unexpected behavior or a defect
title: "[bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! The more detail you provide, the faster it gets triaged.

        **Please do not report security vulnerabilities here** — see `SECURITY.md` for the private reporting channel.

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps or a reduced code example that someone else can run to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Argenta version
      placeholder: e.g. 1.3.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS and platform
      placeholder: e.g. Python 3.13, Arch Linux x86_64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, tracebacks, screenshots
      description: Paste any relevant output. Wrap tracebacks in a code block.
      render: shell
    validations:
      required: false
