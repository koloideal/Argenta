name: Feature request
description: Suggest a new feature or an improvement
title: "[feat] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting: check the [docs](https://argenta.wiki) and search existing issues — your idea may already be covered or requested.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Why would it be useful to most users, not just your case?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Feel free to sketch the API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried or considered.
    validations:
      required: false
